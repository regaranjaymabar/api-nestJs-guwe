services:
  postgres-db:
    image: postgres:16-alpine
    container_name: harkat_postgres_1
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: halo
      POSTGRES_DB: harkat_store_db
    ports:
      # port komputer saya:port container docker
      - "5432:5432"
    volumes:
      - postgres_data_volume:/var/lib/postgresql/data

volumes:
  postgres_data_volume: